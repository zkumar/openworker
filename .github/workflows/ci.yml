# App CI — the coworker Python suite, the GUI unit tests, and the hermetic
# Playwright e2e suite (mocked /v1 + WS; no model or network needed).
# pytest-gate blocks: the product's test files, all green. pytest-full runs the whole
# suite non-blocking so its known failure debt stays visible (docs/known-failures.md).

name: CI

on: [push, pull_request]

jobs:
  pytest-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,bedrock]"
      - name: Test the gate
        run: >-
          pytest tests/test_channel_route.py tests/test_channels.py
          tests/test_dispatch_router.py tests/test_ingress.py tests/test_receipt_integrity.py
          tests/test_receipt_verification.py tests/test_runstore.py tests/test_keys.py
          tests/test_receipt_body.py tests/test_mcp_tool_selection.py
          tests/test_shell_env_isolation.py tests/test_temporal_optin.py -q

  pytest-full:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[messaging,dev,bedrock]"
      - name: Test with coverage
        run: pytest tests -q --cov=coworker --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  gui-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Typecheck
        working-directory: surfaces/gui
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: surfaces/gui
        run: npm test
      # The committed renderer app must match the shared components it is built from.
      - name: Renderer app is current
        working-directory: surfaces/gui
        run: |
          npm run build:views
          git diff --exit-code -- ../views/

  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json
      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci
      - name: Install Playwright browsers
        working-directory: surfaces/gui
        run: npx playwright install --with-deps chromium
      - name: e2e
        working-directory: surfaces/gui
        run: npm run e2e
